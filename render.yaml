services:
  - type: web
    name: hanging-clozet
    runtime: python
    buildCommand: "echo no build step"
    startCommand: "python server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: hanging-clozet-data
      mountPath: /var/data
      sizeGB: 1
